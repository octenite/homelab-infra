# Used through ANSIBLE_CONFIG (set by the just recipes): Ansible ignores an
# ansible.cfg found in a world-writable directory, and a Windows drive mounted
# in WSL2 is world-writable.
[defaults]
inventory = ../../private/ansible/inventory/hosts.yaml
collections_path = ./collections
roles_path = ./roles
host_key_checking = True
retry_files_enabled = False
callback_result_format = yaml
# Encrypted variable files are decrypted by the sops plugin, which must come
# after host_group_vars so its values win.
vars_plugins_enabled = host_group_vars,community.sops.sops
