---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

# On the first run the unit does not exist yet; the exporter role creates and
# starts it afterwards with the drop-in already in place.
- name: Restart smartctl_exporter
  ansible.builtin.systemd_service:
    name: smartctl_exporter
    state: restarted
  register: pve_host_smartctl_restart
  failed_when: pve_host_smartctl_restart.failed and ('Could not find' not in pve_host_smartctl_restart.msg | default(''))

# Reads its settings at start; absent on a host whose storage entry does not
# exist yet, which is fine.
- name: Restart pbs-keepalive
  ansible.builtin.systemd_service:
    name: pbs-keepalive
    state: restarted
  register: pve_host_keepalive_restart
  failed_when: pve_host_keepalive_restart.failed and ('Could not find' not in pve_host_keepalive_restart.msg | default(''))

- name: Reload pve-firewall
  ansible.builtin.command:
    cmd: pve-firewall restart
  changed_when: true
