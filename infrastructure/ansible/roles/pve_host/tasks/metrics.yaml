---
# Thin-pool usage is not visible to node_exporter by itself. A timer writes it
# into the textfile collector's directory, which the node_exporter role (same
# play) serves on the management address.
# Ownership is left to the node_exporter role, which runs after this one and
# sets the same mode.
- name: Textfile collector directory
  ansible.builtin.file:
    path: "{{ pve_host_textfile_dir }}"
    state: directory
    mode: "0775"

- name: Thin-pool metrics script
  ansible.builtin.copy:
    src: lvm-thin-metrics.sh
    dest: /usr/local/bin/lvm-thin-metrics
    mode: "0755"
    owner: root
    group: root

- name: Thin-pool metrics service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: lvm-thin-metrics.service
      content: |
        [Unit]
        Description=Thin-pool usage for the textfile collector

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/lvm-thin-metrics {{ pve_host_textfile_dir }}
    - name: lvm-thin-metrics.timer
      content: |
        [Unit]
        Description=Refresh the thin-pool metrics

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec={{ pve_host_lvm_metrics_interval }}
        AccuracySec=30s

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd units

- name: Units reloaded before the timer starts
  ansible.builtin.meta: flush_handlers

- name: Thin-pool metrics timer enabled
  ansible.builtin.systemd_service:
    name: lvm-thin-metrics.timer
    enabled: true
    state: started

# The upstream smartctl_exporter unit runs as an unprivileged user and cannot
# open the disk. Reading SMART data needs the device node (group disk) and
# raw SCSI commands (CAP_SYS_RAWIO); nothing else is granted. The drop-in is
# in place before the role creates the unit.
- name: Drop-in directory for the SMART exporter
  ansible.builtin.file:
    path: /etc/systemd/system/smartctl_exporter.service.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: SMART exporter may read the disks
  ansible.builtin.copy:
    dest: /etc/systemd/system/smartctl_exporter.service.d/homelab.conf
    mode: "0644"
    content: |
      [Service]
      SupplementaryGroups=disk
      AmbientCapabilities=CAP_SYS_RAWIO CAP_SYS_ADMIN
      CapabilityBoundingSet=CAP_SYS_RAWIO CAP_SYS_ADMIN
  notify:
    - Reload systemd units
    - Restart smartctl_exporter

- name: Check for a first metrics file
  ansible.builtin.stat:
    path: "{{ pve_host_textfile_dir }}/lvm_thin.prom"
  register: pve_host_lvm_metrics_file

- name: Thin-pool metrics written once now
  ansible.builtin.systemd_service:
    name: lvm-thin-metrics.service
    state: started
  when: not pve_host_lvm_metrics_file.stat.exists
