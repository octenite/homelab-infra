---
- name: Swap is a safety net only
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ pve_host_swappiness }}"
    sysctl_file: /etc/sysctl.d/90-homelab.conf

# The host bridges guests at layer 2 only; it must never route between the
# direct link and the management VLAN.
- name: No IP forwarding
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "0"
    sysctl_file: /etc/sysctl.d/90-homelab.conf
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding

- name: KSM off (cross-VM side channel; hides memory pressure)
  ansible.builtin.service:
    name: ksmtuned
    enabled: false
    state: stopped
  failed_when: false

- name: Read the KSM run flag
  ansible.builtin.slurp:
    src: /sys/kernel/mm/ksm/run
  register: pve_host_ksm_run

- name: KSM run flag off now
  ansible.builtin.shell:
    cmd: echo 0 > /sys/kernel/mm/ksm/run
  when: (pve_host_ksm_run.content | b64decode | trim) != '0'
  changed_when: true

- name: Journal directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: root
    group: "{{ item.group }}"
  loop:
    - path: /etc/systemd/journald.conf.d
      mode: "0755"
      group: root
    - path: /var/log/journal
      mode: "2755"
      group: systemd-journal

- name: Persistent, capped journal
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/homelab.conf
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse={{ pve_host_journal_max_use }}
  notify: Restart journald
