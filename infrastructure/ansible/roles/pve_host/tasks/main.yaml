---
- name: Leftover install media
  ansible.builtin.import_tasks: install-media.yaml

- name: Packages and repositories
  ansible.builtin.import_tasks: apt.yaml

- name: SSH
  ansible.builtin.import_tasks: ssh.yaml

- name: Time
  ansible.builtin.import_tasks: time.yaml

- name: Kernel, memory and logs
  ansible.builtin.import_tasks: system.yaml

# Restarts requested so far (sshd, chrony, journald) happen now. The bridge
# change that follows stops the play on purpose when it is not confirmed; a
# failed host runs no handlers, and on the next run the files are already in
# place, so nothing would ever restart those services.
- name: Apply pending service restarts before the bridge change
  ansible.builtin.meta: flush_handlers

- name: Bridges
  ansible.builtin.import_tasks: network.yaml

- name: Firewall
  ansible.builtin.import_tasks: firewall.yaml

- name: Host metrics
  ansible.builtin.import_tasks: metrics.yaml

- name: Roles, users and access control
  ansible.builtin.import_tasks: access.yaml

- name: Backups
  ansible.builtin.import_tasks: backup.yaml

- name: Notifications to Telegram
  ansible.builtin.import_tasks: notify.yaml
  when: telegram_bot_token is defined and telegram_chat_id is defined

# Restarts that a change requested are applied before the play ends, so a
# failure in a later task cannot leave a service on its old configuration.
- name: Apply pending service restarts
  ansible.builtin.meta: flush_handlers
