---
# The daemon's settings come before the package: the package starts the
# daemon the moment it is installed, and it should start with them.
- name: Docker's configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

# Capped container logs, and containers that keep running while the daemon
# restarts for an update.
- name: Docker daemon settings
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ staging_vm_docker_log_max_size }}",
          "max-file": "{{ staging_vm_docker_log_max_file }}"
        },
        "live-restore": true
      }
  notify: Restart docker

- name: Docker at the pinned versions
  ansible.builtin.apt:
    name: "{{ staging_vm_docker_packages.keys() | zip(staging_vm_docker_packages.values()) | map('join', '=') | list }}"
    state: present
    allow_downgrade: true
    install_recommends: false
    cache_valid_time: 3600

- name: Docker enabled and running
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

# Old images and build cache are what fills a deploy server's disk. Weekly,
# and only what no container uses and is older than a week.
- name: Weekly clean-up unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-docker-prune.service
    mode: "0644"
    content: |
      # Managed by Ansible (roles/staging_vm).
      [Unit]
      Description=Remove unused Docker images and build cache older than a week
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker image prune --all --force --filter until=168h
      ExecStart=/usr/bin/docker builder prune --force --filter until=168h
  notify: Reload systemd units

- name: Weekly clean-up timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-docker-prune.timer
    mode: "0644"
    content: |
      # Managed by Ansible (roles/staging_vm).
      [Unit]
      Description=Weekly Docker clean-up

      [Timer]
      OnCalendar=Sun 05:00
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: Reload systemd units

- name: Units reloaded before the timer is enabled
  ansible.builtin.meta: flush_handlers

- name: Weekly clean-up timer enabled
  ansible.builtin.systemd_service:
    name: homelab-docker-prune.timer
    enabled: true
    state: started
