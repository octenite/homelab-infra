---
# Keys only, no root, and only the operator account and the developers'
# group. The team's sessions arrive from the tunnel client on this machine,
# after Cloudflare's login; the operator's arrive from the workstation (E24).
# Either way sshd asks for a key of its own: the login in front is a second
# lock, not a replacement.
- name: SSH is key-only, for the operator and the developers' group
  ansible.builtin.copy:
    dest: "{{ staging_vm_sshd_dropin }}"
    mode: "0644"
    content: |
      AddressFamily inet
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowGroups {{ staging_vm_ops_user }} developers
      X11Forwarding no
      ClientAliveInterval 300
      ClientAliveCountMax 2
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

# The operator account's keys follow the inventory on every run. Guarded like
# the other hosts: the list must hold at least two keys, one of them loaded
# in the operator's agent, so that a bad edit cannot lock the operator out.
- name: Read the public keys held by the operator's agent
  ansible.builtin.command:
    cmd: ssh-add -L
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  register: staging_vm_agent_keys

- name: Refuse a key list that would lock the operator out
  ansible.builtin.assert:
    that:
      - staging_vm_ssh_authorized_keys | length >= 2
      - >-
        (staging_vm_agent_keys.stdout_lines | map('split') | map(attribute=1) | list)
        | intersect(staging_vm_ssh_authorized_keys | map('split') | map(attribute=1) | list)
        | length > 0
    fail_msg: "The key list must hold at least two keys, one of them loaded in the agent."
    quiet: true

- name: Operator account's authorised keys follow the inventory
  ansible.posix.authorized_key:
    user: "{{ staging_vm_ops_user }}"
    key: "{{ staging_vm_ssh_authorized_keys | join('\n') }}"
    exclusive: true

- name: No key is authorised for root
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: absent
