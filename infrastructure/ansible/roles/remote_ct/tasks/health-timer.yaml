---
# Included by health.yaml once the switch's address is known.
- name: Configuration directory
  ansible.builtin.file:
    path: "{{ remote_ct_health_dir }}"
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: The switch's address, root only
  ansible.builtin.copy:
    dest: "{{ remote_ct_health_env }}"
    mode: "0600"
    owner: root
    group: root
    content: "HEALTH_PING_URL={{ remote_ct_health_ping_url }}\n"
  no_log: true

- name: Health script
  ansible.builtin.copy:
    src: remote-health.py
    dest: /usr/local/bin/remote-health
    mode: "0755"

- name: Health service
  ansible.builtin.copy:
    dest: /etc/systemd/system/remote-health.service
    mode: "0644"
    content: |
      # Managed by Ansible (roles/remote_ct).
      [Unit]
      Description=Report the tunnel's state to the dead-man's switch
      After=tailscaled.service

      [Service]
      Type=oneshot
      User={{ remote_ct_health_user }}
      Group={{ remote_ct_health_user }}
      EnvironmentFile={{ remote_ct_health_env }}
      ExecStart=/usr/local/bin/remote-health
      NoNewPrivileges=yes
      CapabilityBoundingSet=
      RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
  notify: Reload systemd units

- name: Health timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/remote-health.timer
    mode: "0644"
    content: |
      # Managed by Ansible (roles/remote_ct).
      [Unit]
      Description=Report the tunnel's state every few minutes

      [Timer]
      OnBootSec=2min
      OnUnitActiveSec={{ remote_ct_health_interval }}
      RandomizedDelaySec=30s

      [Install]
      WantedBy=timers.target
  notify: Reload systemd units

- name: Units reloaded before the timer is enabled
  ansible.builtin.meta: flush_handlers

- name: Health timer enabled
  ansible.builtin.systemd_service:
    name: remote-health.timer
    enabled: true
    state: started
