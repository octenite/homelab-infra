---
- name: SSH is key-only, operator account only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/20-homelab.conf
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers {{ pbs_ops_user }}
      X11Forwarding no
      ClientAliveInterval 300
      ClientAliveCountMax 2
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Remove the bootstrap drop-in, superseded by the one above
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/10-homelab-bootstrap.conf
    state: absent
  notify: Restart sshd

# The operator account's keys follow the inventory on every run, so a
# rotated or revoked key takes effect with this play and not only at
# bootstrap. Guarded like the network devices: the list must hold at least
# two keys, one of them loaded in the operator's agent, so that a bad edit
# cannot lock the operator out.
- name: Read the public keys held by the operator's agent
  ansible.builtin.command:
    cmd: ssh-add -L
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  register: pbs_host_agent_keys

- name: Refuse a key list that would lock the operator out
  ansible.builtin.assert:
    that:
      - pbs_ssh_authorized_keys | length >= 2
      - >-
        (pbs_host_agent_keys.stdout_lines | map('split') | map(attribute=1) | list)
        | intersect(pbs_ssh_authorized_keys | map('split') | map(attribute=1) | list)
        | length > 0
    fail_msg: "The key list must hold at least two keys, one of them loaded in the agent."
    quiet: true

- name: Operator account's authorised keys follow the inventory
  ansible.posix.authorized_key:
    user: "{{ pbs_ops_user }}"
    key: "{{ pbs_ssh_authorized_keys | join('\n') }}"
    exclusive: true

# Root has no SSH path at all (PermitRootLogin no, AllowUsers above); its way
# in is the VM console with the password. A key file for root would only
# become a login path if the drop-in above were lost.
- name: No key is authorised for root
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: absent
