---
- name: Packages and repositories
  ansible.builtin.import_tasks: apt.yaml

- name: SSH
  ansible.builtin.import_tasks: ssh.yaml

- name: Direct link leg
  ansible.builtin.import_tasks: network.yaml

- name: Firewall
  ansible.builtin.import_tasks: firewall.yaml

# Restarts and reloads requested so far (sshd, nftables) happen now: a
# failure in the datastore tasks would otherwise lose them for good, because
# on the next run the files are already in place and nothing is notified.
- name: Apply pending service restarts before the datastore
  ansible.builtin.meta: flush_handlers

- name: Datastore and maintenance jobs
  ansible.builtin.import_tasks: datastore.yaml

- name: Notifications to Telegram
  ansible.builtin.import_tasks: notify.yaml
  when: telegram_bot_token is defined and telegram_chat_id is defined

- name: Apply pending service restarts
  ansible.builtin.meta: flush_handlers
