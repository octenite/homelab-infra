---
# Unattended upgrades: Debian security only, no automatic reboot.
pbs_host_unattended_reboot: false

# Set for one run only (-e pbs_host_datastore_recreate=true) when the datastore
# disk was replaced or wiped on purpose: the server then forgets the old
# datastore and an empty one is created. Every backup is gone in that case.
pbs_host_datastore_recreate: false

# Maintenance schedules (systemd calendar syntax), inside the nightly window
# (B51): the hypervisor's backup at 02:30, prune after it, garbage collection
# and verification on Sundays. Verification is weekly: a run cut short counts
# as run, and a monthly one would then wait a month.
pbs_host_prune_schedule: "*-*-* 02:50"
pbs_host_gc_schedule: "sun 02:55"
pbs_host_verify_schedule: "sun 03:00"
pbs_host_verify_outdated_days: 30

# The package timers, moved into the window too (upstream they fire at random
# times of the day, when the VM is now off).
pbs_host_night_timers:
  - timer: apt-daily.timer
    at: "*-*-* 02:44"
  - timer: proxmox-backup-daily-update.timer
    at: "*-*-* 02:47"
  - timer: apt-daily-upgrade.timer
    at: "*-*-* 02:50"
