---
# Verifies devices against Git and disarms a pending revert. Run after an
# apply that was left unverified or unconfirmed on purpose. It changes nothing
# else, and it fails without disarming when a device does not match Git or a
# health check fails.
- name: Verify OpenWrt devices and confirm a pending change
  # No default on purpose: without an explicit target the play matches no host.
  hosts: "{{ target | default('no_target_given') }}"
  gather_facts: false
  serial: 1
  vars:
    openwrt_install_recommended_packages: false
  roles:
    - role: community.openwrt.init
  tasks:
    - name: Verify and confirm
      ansible.builtin.import_role:
        name: openwrt_config
        tasks_from: confirm
