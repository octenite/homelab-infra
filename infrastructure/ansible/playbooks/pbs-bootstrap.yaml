---
# First contact with a freshly installed Proxmox Backup Server. Runs once as
# root with the key the installer authorised, creates the operator account,
# and closes root login. Every later play connects as that account.
- name: Bootstrap a freshly installed Proxmox Backup Server
  hosts: "{{ target | default('pbs') }}"
  gather_facts: true
  become: false
  vars:
    ansible_user: root
  tasks:
    - name: Remove the subscription-only repository
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/pbs-enterprise.sources
        state: absent

    - name: Add the free Proxmox Backup Server repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pbs-no-subscription.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pbs
          Suites: {{ ansible_distribution_release }}
          Components: pbs-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

    - name: Install sudo
      ansible.builtin.apt:
        name: sudo
        state: present
        update_cache: true

    - name: Create the operator account
      ansible.builtin.user:
        name: "{{ pbs_ops_user }}"
        shell: /bin/bash
        groups: [sudo]
        append: true
        create_home: true

    - name: Authorise the same keys for the operator account
      ansible.posix.authorized_key:
        user: "{{ pbs_ops_user }}"
        key: "{{ pbs_ssh_authorized_keys | join('\n') }}"
        exclusive: true

    - name: Let the operator account administer without a password (it has none)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-ops
        content: "{{ pbs_ops_user }} ALL=(ALL) NOPASSWD: ALL\n"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Prove the operator account works before root is closed
      ansible.builtin.command:
        cmd: >-
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new {{ ansible_ssh_extra_args | default('') }}
          -p {{ ansible_port | default(22) }} {{ pbs_ops_user }}@{{ ansible_host }} sudo -n true
      delegate_to: localhost
      changed_when: false

    - name: Close root login over SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-homelab-bootstrap.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
