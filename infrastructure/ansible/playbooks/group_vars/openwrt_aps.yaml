---
# Access points: every configuration file they have is managed. Files that
# are the same on every access point live in templates/access-point/; a file
# in templates/<host>/ takes precedence.
openwrt_config_template_group: access-point
openwrt_config_managed:
  - network
  - wireless
  - dhcp
  - firewall
  - system
  - dropbear
  - uhttpd

# An access point is healthy when it reaches the router in the management
# network, resolves through it, and its own firewall loads cleanly.
openwrt_config_health_commands:
  - "ping -c 2 -W 2 10.0.10.1"
  - "nslookup openwrt.org 10.0.10.1"
  - "fw4 check"
