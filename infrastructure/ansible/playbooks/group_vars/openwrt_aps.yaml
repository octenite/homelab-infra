---
# Access points: every configuration file they have is managed.
openwrt_config_managed:
  - network
  - wireless
  - dhcp
  - firewall
  - system
  - dropbear
  - uhttpd

# An access point is healthy when it reaches the router and resolves through it.
openwrt_config_health_commands:
  - "ping -c 2 -W 2 192.168.1.53"
  - "nslookup openwrt.org 192.168.1.53"
