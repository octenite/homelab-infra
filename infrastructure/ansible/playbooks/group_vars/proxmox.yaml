---
# Proxmox VE hosts. Addresses and the authorised keys come from the private
# inventory; everything here is policy.
ansible_user: ops
ansible_become: true
pve_ops_user: ops

# The keys authorised for root by the installer and for the operator account.
pve_ssh_authorized_keys: "{{ openwrt_ssh_authorized_keys }}"

# Management address and the networks that may reach host services.
pve_mgmt_address: 10.0.10.10
pve_mgmt_network: 10.0.10.0/24
# The workstation's two addresses: dock port first, Wi-Fi adapter second.
pve_workstations: [192.168.1.196, 192.168.1.197]
pve_router: 10.0.10.1
pve_talos_nodes: [10.0.50.11, 10.0.50.21]
pve_talos_workers: [10.0.50.21, 10.0.50.22]
pve_servers_network: 10.0.50.0/24

# Bridges. Port names are path-based on this board: enp3s0 is the onboard
# gigabit port, enp2s0 the 2.5 GbE card. The direct link to the workstation
# is 10.0.99.0/29 (host .1, workstation .2, backup server VM .3).
pve_nic_lan: enp3s0
pve_nic_p2p: enp2s0
# Two lists on purpose. The first is what the bridge carries. The second is
# where the OpenTofu token may attach a guest: one access entry per VLAN is
# built from it below. A VLAN can be on the bridge without the token having
# any right to it. (One list for both, with the access entry taken from its
# first element, would have moved the token's right from the cluster VLAN to
# whichever VLAN was written first.)
#   30  remote access, administration: the container remote1 (Phase R)
#   31  remote access, household: laid empty; the token gets no right to it
#       before the household plan
#   50  the cluster
pve_bridge_vlans: [30, 31, 50]
pve_token_vlans: [30, 50]

# Remote access (Phase R, docs/adr/0005-administrative-access.md). The host
# never holds an address in these two networks. The administration container
# reaches the host's SSH and web interface through the router (E15), so the
# host sees its address as the source.
pve_remote_admin: 10.0.30.10
pve_remote_networks: [10.0.30.0/24, 10.0.31.0/24]

# Container templates, fetched from the vendor's index and compared with a
# checksum kept here. The index is signed, but the pin is what makes a rebuilt
# container start from the same image; a new template is a pull request.
pve_ct_templates:
  - file: debian-13-standard_13.6-1_amd64.tar.zst
    sha512: 4c0c27ca6ceab5ef0b84db57825a00f26157ef1854bafe97297813e1cbe8ecb8cc9c453cab6b3b0efe1ba193a50c47ece1e41d950e411b8730b835b71e9e754b
pve_p2p_address: 10.0.99.1/29
pve_p2p_network: 10.0.99.0/29

# Access (ARCHITECTURE.md section 3, management plane). Custom roles hold
# only what each automation needs: never Administrator, never VM.Monitor.
# The owner's account is the only holder of Administrator; root@pam is
# break-glass. Its password comes from the private inventory.
pve_admin_user: octenite-admin@pve
# Realms that require a second factor once all their users have enrolled.
# Automation users hold no password and log in with tokens only.
pve_tfa_realms: [pve, pam]
# Resource pools. The token's rights are granted per pool, so creating a guest
# outside these pools is refused. Proxmox does not tie a pool to a VLAN, and
# the role's Pool.Allocate lets the token move a guest out again (backlog B43).
pve_pool: talos
pve_pools:
  - name: "{{ pve_pool }}"
    comment: Talos VMs, managed by OpenTofu
  - name: remote
    comment: Remote-access containers, managed by OpenTofu
# The provisioning role carries no Sys.Modify: on a node path that privilege
# covers the host firewall, the bridges, DNS and the hosts file, far beyond
# creating VMs. If the image download of Phase 5 needs a network privilege,
# it gets Sys.AccessNetwork on the node, with a test, when that is proven.
pve_roles:
  TerraformProvisioner: >-
    VM.Allocate VM.Clone VM.Config.CDROM VM.Config.CPU VM.Config.Cloudinit
    VM.Config.Disk VM.Config.HWType VM.Config.Memory VM.Config.Network
    VM.Config.Options VM.PowerMgmt VM.Audit VM.GuestAgent.Audit
    Datastore.AllocateSpace Datastore.AllocateTemplate Datastore.Audit
    SDN.Use Pool.Allocate Pool.Audit Sys.Audit
  KubernetesCSI: >-
    VM.Audit VM.Config.Disk Datastore.Allocate Datastore.AllocateSpace
    Datastore.Audit
pve_users:
  - userid: terraform@pve
    comment: OpenTofu; token held on the workstation only
  - userid: kubernetes-csi@pve
    comment: Proxmox CSI plugin in the cluster
  - userid: prometheus@pve
    comment: pve-exporter in the cluster, read-only
  - userid: drift@pve
    comment: weekly read-only drift job
# One token per user, privilege-separated, 12-month lifetime; issued by
# playbooks/pve-tokens.yaml. Each token receives the ACLs of its user.
pve_tokens:
  - userid: terraform@pve
    tokenid: tofu
  - userid: kubernetes-csi@pve
    tokenid: csi
  - userid: prometheus@pve
    tokenid: exporter
  - userid: drift@pve
    tokenid: weekly
pve_token_lifetime_days: 365
# ACLs: scoped paths wherever the API accepts them. The CSI entries on the
# worker VMs are added in Phase 7, when their IDs exist. An entry removed
# here is removed on the host by the next run. The bridge is granted per
# VLAN: an entry on the bridge itself would also permit a guest NIC without a
# tag, which lands in the management VLAN. Those entries are built from
# pve_token_vlans.
pve_acls: "{{ pve_acls_fixed + pve_acls_vlans }}"
pve_acls_vlans: >-
  {%- set out = [] -%}
  {%- for v in pve_token_vlans -%}
    {%- set _ = out.append({'path': '/sdn/zones/localnetwork/vmbr0/' ~ v, 'role': 'TerraformProvisioner', 'user': 'terraform@pve'}) -%}
  {%- endfor -%}
  {{ out }}
pve_acls_fixed:
  - path: /
    role: Administrator
    user: "{{ pve_admin_user }}"
  - path: "/pool/{{ pve_pool }}"
    role: TerraformProvisioner
    user: terraform@pve
  - path: /pool/remote
    role: TerraformProvisioner
    user: terraform@pve
  - path: /storage/local
    role: TerraformProvisioner
    user: terraform@pve
  - path: /storage/local-lvm
    role: TerraformProvisioner
    user: terraform@pve
  - path: "/nodes/{{ inventory_hostname_short }}"
    role: TerraformProvisioner
    user: terraform@pve
  - path: /storage/local-lvm
    role: KubernetesCSI
    user: kubernetes-csi@pve
  - path: /
    role: PVEAuditor
    user: prometheus@pve
  - path: /
    role: PVEAuditor
    user: drift@pve

# Backups to the backup server VM on the workstation (ARCHITECTURE.md
# sections 4 and 12). The storage entry is created once by
# playbooks/pve-backup-init.yaml (token and encryption key go to the private
# repository); the host role keeps the client credentials, the path failover
# and the nightly host-configuration backup in place.
pve_backup_storage: pbs-node2
pve_backup_datastore: pbs1
pve_backup_user: pve1@pbs
pve_backup_token: backup
pve_backup_primary: 10.0.99.3
pve_backup_fallbacks: "{{ pve_workstations }}"
# The storage entry names the server by this hosts-file name; the failover
# timer rewrites the line (PVE forbids changing a storage's server).
pve_backup_name: pbs1.internal
# The workstation's USB adapter drops an idle direct link after about ten
# seconds (B21); one packet per second is the cadence proven to keep it up
# (five seconds was not enough).
pve_backup_keepalive_seconds: 1
pve_backup_schedule: "*-*-* 02:30:00"
# healthchecks.io ping on success; empty until the owner creates the account.
pve_backup_ping_url: ""

# Exporters (prometheus.prometheus roles), management address only.
# renovate: datasource=github-releases depName=prometheus/node_exporter
node_exporter_version: 1.12.1
node_exporter_web_listen_address: "{{ pve_mgmt_address }}:9100"
node_exporter_textfile_dir: /var/lib/node_exporter
# renovate: datasource=github-releases depName=prometheus-community/smartctl_exporter
smartctl_exporter_version: 0.14.0
smartctl_exporter_web_listen_address: "{{ pve_mgmt_address }}:9633"
