---
# Changes devices: installs the authorised SSH keys from the inventory.
# One device at a time; the previous key file returns by itself unless a
# fresh key login succeeds.
- name: Manage the authorised SSH keys of OpenWrt devices
  hosts: "{{ target | default('openwrt') }}"
  gather_facts: false
  serial: 1
  vars:
    openwrt_install_recommended_packages: false
  roles:
    - role: community.openwrt.init
  tasks:
    - name: Manage authorised keys
      ansible.builtin.import_role:
        name: openwrt_config
        tasks_from: ssh_keys
