---
# Configure a Proxmox VE host. Idempotent; connects as the operator account.
- name: Configure Proxmox VE hosts
  hosts: "{{ target | default('proxmox') }}"
  gather_facts: true
  become: true
  # The role stops on purpose in several places (an unmanaged user, a key
  # list that would lock the operator out, backups not armed). A restart
  # that an earlier task requested must still happen then: on the next run
  # the file is already in place and nothing would ask for it again.
  force_handlers: true
  pre_tasks:
    # First: a real run through the away tunnel stops here (R.9).
    - name: Refuse a real run through the away tunnel
      ansible.builtin.import_role:
        name: away_guard
  roles:
    - role: pve_host
    # Exporters from the upstream collection, bound to the management address
    # (E7). The archives are fetched and checksum-verified on the workstation
    # and only the binaries reach the host.
    - role: prometheus.prometheus.node_exporter
    - role: prometheus.prometheus.smartctl_exporter
  post_tasks:
    # Last on purpose: everything else is applied before a rebuilt host is
    # told that its backups still have to be brought back.
    - name: The backups are armed
      ansible.builtin.include_role:
        name: pve_host
        tasks_from: backup-check

    # After everything else: the template comes from the vendor's server, and
    # a failure there must not keep the host's own configuration, its
    # exporters or its backups from being applied.
    - name: Container templates
      ansible.builtin.include_role:
        name: pve_host
        tasks_from: templates
