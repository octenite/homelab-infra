# Pinned operator toolchain. The same versions run locally and in CI.
# Renovate's mise manager maintains these pins.
#
# Tools for later phases (OpenTofu, kustomize, helm, kubeconform, kubectl,
# talosctl, ansible) are added by the phase that introduces their code, so
# every pin is exercised by a check from the day it lands.

[tools]
uv = "0.12.23"
just = "1.58.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
actionlint = "1.7.12"
gitleaks = "8.30.1"
sops = "3.13.3"
age = "1.3.2"
jq = "1.8.2"
yq = "4.54.1"
"pipx:pre-commit" = "4.6.2"
"pipx:yamllint" = "1.38.0"
# Phase 2: network devices are configured with Ansible.
"pipx:ansible-core" = "2.21.4"
"pipx:ansible-lint" = "26.9.0"
# Phase 3.6: OpenTofu state backend; Phase 5 adds the VMs.
opentofu = "1.13.1"
