# Gitleaks configuration: the built-in rule set, unchanged.
# Allowlist entries need a comment that explains why the match is not a secret.
title = "homelab-infra"

[extend]
useDefault = true

[allowlist]
description = "Third-party Ansible collections installed into the tree by `just ansible-deps`; their test fixtures contain example keys. The directory is ignored by Git."
paths = ['''^infrastructure/ansible/collections/''']
